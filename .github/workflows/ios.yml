# Builds the PolishOS iPhone/iPad app (ios/PolishOS) for the simulator, unsigned: proves it compiles.
# Signed builds for TestFlight come later (needs the Apple Developer account + Tap to Pay entitlement).
name: iPhone app (iOS)

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Xcode 27.1+ = iOS 27.1 SDK. Apps built with an older SDK run letterboxed (iPhone size + black bars)
      # on the iPhone Duo's open screen; 27.1+ fills it. GitHub's "xcode-27" image has it (macos-26 stops at 26.6).
      # Use 27.1 (released, the image's default) so App Store Connect accepts the upload; never a beta.
      - name: Use Xcode 27.1 (fills the iPhone Duo's open screen)
        run: |
          ls -d /Applications/Xcode*.app
          X=/Applications/Xcode_27.1.app
          test -d "$X" || X=/Applications/Xcode.app
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          V=$(xcodebuild -version | awk 'NR==1{print $2}')
          printf '%s\n27.1\n' "$V" | sort -V -C -r || { echo "Xcode $V is older than 27.1: the app would be letterboxed on the iPhone Duo."; exit 1; }
          xcodebuild -showsdks | grep -i iphoneos
      - name: Make the Xcode project
        working-directory: ios/PolishOS
        run: brew install xcodegen && xcodegen generate
      - name: Build for the simulator (no signing)
        working-directory: ios/PolishOS
        run: |
          xcodebuild -project PolishOS.xcodeproj -scheme PolishOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
