# Builds the PolishOS iPhone/iPad app (ios/PolishOS) for the simulator, unsigned: proves it compiles.
# Signed builds for TestFlight come later (needs the Apple Developer account + Tap to Pay entitlement).
name: iPhone app (iOS)

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Xcode 27.1+ = iOS 27.1 SDK. Apps built with an older SDK run letterboxed (iPhone size + black bars)
      # on the iPhone Duo's open screen; 27.1+ fills it. Prefer a released Xcode over a beta.
      - name: Use Xcode 27.1 or newer (fills the iPhone Duo's open screen)
        run: |
          ls -d /Applications/Xcode*.app
          pick() { ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E 'Xcode_(27\.([1-9]|[1-9][0-9])|2[89]|[3-9][0-9])' | grep -viE "$1" | sort -V | tail -1; }
          X=$(pick 'beta|rc'); test -n "$X" || X=$(pick '^$')
          test -n "$X" || { echo "No Xcode 27.1+ on this Mac (needed so the app fills the iPhone Duo screen)."; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
      - name: Make the Xcode project
        working-directory: ios/PolishOS
        run: brew install xcodegen && xcodegen generate
      - name: Build for the simulator (no signing)
        working-directory: ios/PolishOS
        run: |
          xcodebuild -project PolishOS.xcodeproj -scheme PolishOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
