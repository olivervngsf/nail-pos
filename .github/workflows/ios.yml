# Builds the PolishOS iPhone/iPad app (ios/PolishOS) for the simulator, unsigned: proves it compiles.
# Signed builds for TestFlight come later (needs the Apple Developer account + Tap to Pay entitlement).
name: iPhone app (iOS)

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Xcode 27.1+ = iOS 27.1 SDK. Apps built with an older SDK run letterboxed (iPhone size + black bars)
      # on the iPhone Duo's open screen; 27.1+ fills it. GitHub's "xcode-27" image has it (macos-26 stops at 26.6).
      # Use the newest RELEASED Xcode 27.x on the image (27.2 now, same as Oliver's Mac) so App Store Connect
      # accepts the upload; never a beta/RC. Falls back to the image's default Xcode.
      - name: Use the newest Xcode 27 (27.1+ fills the iPhone Duo's open screen)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_27.[0-9]*.app 2>/dev/null | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1)
          test -n "$X" || X=/Applications/Xcode.app
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          V=$(xcodebuild -version | awk 'NR==1{print $2}')
          printf '%s\n27.1\n' "$V" | sort -V -C -r || { echo "Xcode $V is older than 27.1: the app would be letterboxed on the iPhone Duo."; exit 1; }
          xcodebuild -showsdks | grep -i iphoneos
      - name: Make the Xcode project
        working-directory: ios/PolishOS
        run: brew install xcodegen && xcodegen generate
      - name: Build for the simulator (no signing)
        working-directory: ios/PolishOS
        run: |
          xcodebuild -project PolishOS.xcodeproj -scheme PolishOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
      # Compiling is not enough: on Nov 28 a build that compiled crashed the moment it opened (iOS 27 SDK
      # needs the scene life cycle). Open the app on a simulated iPhone and fail if it is gone after 15 s.
      - name: Open the app on a simulated iPhone (must not crash)
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/PolishOS.app)
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.polishos.app
          sleep 15
          if xcrun simctl spawn "$DEV" launchctl list | grep -q 'com.polishos.app'; then echo "App still running after 15 s: OK"; else
            echo "PolishOS crashed or quit on launch."; ls ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -5; exit 1; fi
