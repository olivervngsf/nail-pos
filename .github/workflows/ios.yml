# Builds the PolishOS iPhone/iPad app (ios/PolishOS) for the simulator, unsigned: proves it compiles.
# Signed builds for TestFlight come later (needs the Apple Developer account + Tap to Pay entitlement).
name: iPhone app (iOS)

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26 or newer (Apple refuses uploads built with older Xcode)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          test -n "$X" || { echo "No Xcode 26+ on this Mac. Installed:"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Make the Xcode project
        working-directory: ios/PolishOS
        run: brew install xcodegen && xcodegen generate
      - name: Build for the simulator (no signing)
        working-directory: ios/PolishOS
        run: |
          xcodebuild -project PolishOS.xcodeproj -scheme PolishOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
