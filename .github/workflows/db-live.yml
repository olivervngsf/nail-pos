name: Live database
# After CI passes on main, run any new supabase/migrations files on the LIVE Supabase project.
# Needs the repo secret LIVE_DB_URL (live project's connection string). Without it, this does nothing.
# Can also be run by hand: Actions → Live database → Run workflow (tick "dry run" to only list what would run).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would run"
        type: boolean
        default: true

concurrency: live-db

jobs:
  push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check the live database is connected (repo secret LIVE_DB_URL)
        id: has
        run: |
          echo "ok=${{ secrets.LIVE_DB_URL != '' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ secrets.LIVE_DB_URL != '' }}" != "true" ]; then
            msg="Live database NOT updated: the repo secret LIVE_DB_URL is missing (Settings → Secrets and variables → Actions)."
            echo "::warning title=Live database skipped::$msg"
            echo "### ⚠️ $msg" >> "$GITHUB_STEP_SUMMARY"
            # Run by hand = you meant it to run: fail red instead of a green skip.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then exit 1; fi
          fi
      - name: Install psql
        if: steps.has.outputs.ok == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: Run new migrations on live
        if: steps.has.outputs.ok == 'true'
        run: |
          set -o pipefail
          rc=0
          scripts/db-push-live.sh ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} 2>&1 | tee out.txt || rc=$?
          { echo "### Live database"; echo '```'; grep -E "running|would run|live database|FAILED" out.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
        env:
          LIVE_DB_URL: ${{ secrets.LIVE_DB_URL }}
