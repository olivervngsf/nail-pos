name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Every migration has its own version (live push skips by version)
        run: scripts/check-migrations.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kit is in sync with design/kit/kit.css
        run: npm run kit:sync && git diff --exit-code src/styles/
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (money, offline queue, translations)
        run: npm test
      - run: npm run build
      - name: Install browser
        # Newer runners (Ubuntu 26.04) list Microsoft's apt repo, which answers 403 for that release and
        # stops `--with-deps` (Nov 26). We don't need anything from it, so drop it before apt runs.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*
          npx playwright install --with-deps chromium
      - name: Screen tests (desktop + phone)
        run: npm run e2e
      - name: Database tests on a throwaway Postgres (every migration + salon wall, accounts, checkout, review fixes)
        run: scripts/test-db-local.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
      - name: Salon-wall tests on the Supabase test project (skipped until the DATABASE_URL secret is added)
        run: npm run test:rls
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
