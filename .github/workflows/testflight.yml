# Signs the iPhone app. Run by hand: Actions → "iPhone app → TestFlight" → Run workflow, pick where it goes:
#  - "TestFlight": uploads to TestFlight (no Tap to Pay: Apple's Nov 24 grant is DEVELOPMENT only = registered test
#    iPhones only; TestFlight/App Store need the publishing grant after Apple's review).
#  - "Test iPhone (Tap to Pay)": development-signed .ipa WITH Tap to Pay for the iPhones registered in
#    developer.apple.com → Devices. Download the artifact, put both files in public/ios/, open
#    polishosapp.com/ios/index.html on that iPhone → Install.
# Needs repo secrets (never in the code): APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's text).
# Signing is automatic in Apple's cloud (the App Store Connect key must have the Admin role).
name: iPhone app → TestFlight

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where the build goes"
        type: choice
        options:
          - "Test iPhone (Tap to Pay)"
          - "TestFlight"
        default: "Test iPhone (Tap to Pay)"

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Xcode 27.1+ = iOS 27.1 SDK. Apps built with an older SDK run letterboxed (iPhone size + black bars)
      # on the iPhone Duo's open screen; 27.1+ fills it. Prefer a released Xcode over a beta.
      - name: Use Xcode 27.1 or newer (fills the iPhone Duo's open screen)
        run: |
          ls -d /Applications/Xcode*.app
          pick() { ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E 'Xcode_(27\.([1-9]|[1-9][0-9])|2[89]|[3-9][0-9])' | grep -viE "$1" | sort -V | tail -1; }
          X=$(pick 'beta|rc'); test -n "$X" || X=$(pick '^$')
          test -n "$X" || { echo "No Xcode 27.1+ on this Mac (needed so the app fills the iPhone Duo screen)."; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
      - name: Make the Xcode project
        working-directory: ios/PolishOS
        run: brew install xcodegen && xcodegen generate
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "Add the ASC_KEY_P8 secret first (see ios/PolishOS/README.md)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          # The .p8 text is often pasted with its line breaks lost (one long line) or without the BEGIN/END lines.
          # Rebuild a clean key file from whatever was pasted, then check it really is a private key.
          python3 - "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" <<'PY'
          import base64, os, re, sys
          raw = os.environ["ASC_KEY_P8"]
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          try:
              der = base64.b64decode(body, validate=True)
          except Exception:
              der = b""
          if len(der) < 100:
              sys.exit("ASC_KEY_P8 is not the .p8 key file. Open AuthKey_XXXX.p8 in TextEdit, copy ALL of it, and paste it again into the GitHub secret.")
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n")
          print("Key file OK (%d bytes)." % len(der))
          PY
      - name: Archive (signed)
        working-directory: ios/PolishOS
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ENTITLEMENTS: ${{ inputs.target == 'TestFlight' && 'PolishOS/PolishOS-NoTap.entitlements' || 'PolishOS/PolishOS.entitlements' }}
        run: |
          set -o pipefail
          xcodebuild -project PolishOS.xcodeproj -scheme PolishOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PolishOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_ENTITLEMENTS="$ENTITLEMENTS" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -60
      - name: Upload to TestFlight
        if: inputs.target == 'TestFlight'
        working-directory: ios/PolishOS
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PolishOS.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
      - name: Make the test iPhone install file (.ipa + manifest)
        if: inputs.target != 'TestFlight'
        working-directory: ios/PolishOS
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" ExportOptions-dev.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PolishOS.xcarchive" \
            -exportOptionsPlist ExportOptions-dev.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          mkdir -p "$RUNNER_TEMP/ios"
          mv "$RUNNER_TEMP"/export/*.ipa "$RUNNER_TEMP/ios/PolishOS.ipa"
          APP_PLIST="$RUNNER_TEMP/PolishOS.xcarchive/Products/Applications/PolishOS.app/Info.plist"
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PLIST")
          # Over-the-air install: Safari on the iPhone reads this file from polishosapp.com/ios/.
          cat > "$RUNNER_TEMP/ios/manifest.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array><dict>
              <key>kind</key><string>software-package</string>
              <key>url</key><string>https://polishosapp.com/ios/PolishOS.ipa</string>
            </dict></array>
            <key>metadata</key><dict>
              <key>bundle-identifier</key><string>com.polishos.app</string>
              <key>bundle-version</key><string>$VER</string>
              <key>kind</key><string>software</string>
              <key>title</key><string>PolishOS</string>
            </dict>
          </dict></array></dict></plist>
          EOF
          echo "Built PolishOS $VER (build ${{ github.run_number }}) with Tap to Pay for the registered test iPhones."
      - name: Keep the install files
        if: inputs.target != 'TestFlight'
        uses: actions/upload-artifact@v4
        with:
          name: polishos-ios-test-${{ github.run_number }}
          path: ${{ runner.temp }}/ios
      - if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
