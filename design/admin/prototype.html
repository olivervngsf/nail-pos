<title>Nail POS Admin Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block");
/* Nail POS — checkout look: compact, calm, Apple-like. Colors from Nail Salon OS DS. */
:root{
  --ink:#1C1C1E; --ink-soft:#5C5C5E; --muted:#8E8E93; --line:#E5E5EA;
  --paper:#FFFFFF; --surface:#F5F5F7; --fill:#EFEFF2;
  --jade:#2F9E44; --jade-soft:#EAF5EC; --orange:#E8590C; --orange-soft:#FDEEE6; --red:#E03131;
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --shadow:0 0.5px 0 rgba(0,0,0,.04),0 6px 24px rgba(28,28,30,.06);
  --ease:cubic-bezier(.2,.8,.2,1);
}
body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-feature-settings:"cv11","ss01";color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
a{color:var(--ink)} a:hover{color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums}
.cap{font-size:13px;line-height:18px;color:var(--ink-soft);letter-spacing:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
.h1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-0.025em}
.h2{font-size:20px;line-height:26px;font-weight:600;letter-spacing:-0.02em}
.money{font-size:34px;line-height:40px;font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}

/* app shell */
.app{width:1280px;height:800px;display:flex;background:var(--surface);overflow:hidden}
.rail{width:76px;background:rgba(255,255,255,.72);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-bottom:12px}
.rail a{width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:var(--r-sm);font-size:11px;color:var(--ink-soft);text-decoration:none;transition:background .2s var(--ease)}
.rail a:hover{background:var(--fill)}
.rail a.on{background:var(--fill);color:var(--ink);font-weight:600}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;background:rgba(245,245,247,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.bar .title{flex:1;font-size:17px;font-weight:600;letter-spacing:-0.02em}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--paper);border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--jade)}
.pill.ok{background:var(--jade-soft);border-color:transparent}
.pill.warn{background:var(--orange-soft);border-color:var(--orange)}
.who{display:flex;align-items:center;gap:8px;font-size:14px}
.av{width:32px;height:32px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
.av.lg{width:52px;height:52px;font-size:18px}

/* surfaces */
.card{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.group{background:var(--paper);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);font-size:16px}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.sep{height:1px;background:var(--line)}
.line{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--fill);color:var(--ink)}
.tag.jade{background:var(--jade-soft)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-sm);border:0;background:var(--fill);color:var(--ink);font:inherit;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .15s var(--ease),background .2s var(--ease),opacity .2s}
.btn:hover{background:#E6E6EA;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:#fff;height:52px;font-size:17px;border-radius:var(--r-md)}
.btn.primary:hover{opacity:.88;color:#fff}
.btn.ghost{background:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--fill)}
.btn.block{display:flex;width:100%}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--fill);gap:2px}
.seg span{height:30px;padding:0 14px;border-radius:8px;display:flex;align-items:center;font-size:13px;font-weight:600;color:var(--ink-soft)}
.seg span.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tile{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(28,28,30,.10);color:var(--ink)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center}

/* motion: fade in on arrival, fade between steps. Off when reduced motion. */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.in{animation:fadeUp .45s var(--ease) both}
.in2{animation:fadeUp .45s var(--ease) .08s both}
.in3{animation:fadeUp .45s var(--ease) .16s both}
.fade{animation:fadeIn .6s var(--ease) both}
.pulse{animation:pulse 1.4s ease-in-out infinite}
.pop{animation:pop .5s var(--ease) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* phone */
.phone{width:390px;height:844px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.pbar{height:52px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;border-bottom:1px solid var(--line);background:rgba(245,245,247,.8);flex:none}

/* ===== v2 shared components (Nov 16) — one version each; never redefine inside a screen ===== */
/* Forms */
.lbl{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block}
.inp{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:0 14px;font:inherit;font-size:17px;color:var(--ink);box-sizing:border-box;transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(28,28,30,.08)}
.inp.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,49,49,.10)}
.hint{font-size:13px;line-height:18px;color:var(--ink-soft);margin-top:6px}
.hint.err{color:var(--red)}
/* Chip: filters + quick picks. 36px. .on = chosen, .sug = AI suggestion (dashed) */
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.sug{border-style:dashed}
/* Switch (on/off). .sw and .toggle are the same */
.sw,.toggle{width:44px;height:26px;border-radius:13px;background:#D1D1D6;position:relative;flex:none;border:0;cursor:pointer;transition:background .25s}
.sw::after,.toggle::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.sw.on,.toggle.on{background:var(--jade)}
.sw.on::after,.toggle.on::after{transform:translateX(18px)}
/* Option row: tappable list row inside .group. 56px */
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:var(--paper);font:inherit;font-size:16px;color:var(--ink);text-align:left;cursor:pointer;transition:background .2s}
.opt:last-child{border-bottom:0}
.opt:hover{background:#FAFAFB}
.opt.on{background:var(--surface)}
/* Choice card: big pick (setup, pay method) */
.pick{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--paper);font:inherit;text-align:left;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.pick.on{border:2px solid var(--ink);box-shadow:var(--shadow)}
/* PIN keypad */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:60px;border-radius:14px;border:0;background:var(--paper);box-shadow:0 .5px 0 rgba(0,0,0,.04),0 2px 8px rgba(28,28,30,.06);font:inherit;font-size:24px;font-weight:500;color:var(--ink);cursor:pointer;transition:transform .12s}
.key:active{transform:scale(.96)}
.dots{display:flex;gap:14px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);box-sizing:border-box}
.dots i.on{background:var(--ink)}
/* Overlays */
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.scrim{position:absolute;inset:0;background:rgba(28,28,30,.22);z-index:5;border:0;padding:0;animation:fadeIn .25s ease both}
.drawer{position:absolute;top:0;right:0;bottom:0;width:440px;background:var(--paper);box-shadow:-12px 0 40px rgba(28,28,30,.16);z-index:6;display:flex;flex-direction:column;animation:slideIn .35s var(--ease) both}
.drawer-h{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);font-size:17px;font-weight:600}
.drawer-b{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.drawer-f{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;background:var(--paper);border-radius:24px;box-shadow:0 -6px 24px rgba(28,28,30,.12);padding:20px;display:flex;flex-direction:column;gap:12px;animation:sheetUp .35s var(--ease) both}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);min-width:420px;max-width:calc(100% - 32px);box-sizing:border-box;background:var(--ink);color:#fff;border-radius:14px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;font-size:15px;box-shadow:0 12px 32px rgba(0,0,0,.25);z-index:20;animation:fadeUp .35s var(--ease) both}
.toast .btn,.toast button{height:34px;padding:0 14px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.phone .toast{min-width:0;left:16px;right:16px;transform:none}
/* Banner: offline / syncing / warning strip under the top bar */
.banner{display:flex;align-items:center;gap:10px;height:34px;padding:0 16px;background:var(--orange-soft);border-bottom:1px solid #F4C9AF;font-size:13px;box-sizing:border-box;animation:fadeIn .4s ease both}
.banner.ok{background:var(--jade-soft);border-color:#CFE8D4}
/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px;text-align:center;color:var(--ink-soft)}
.empty .h2{color:var(--ink)}

/* ===== v3 shared components (Nov 16) ===== */
/* Rows: one row style, 5 sizes. Use inside .group. .g = grows, its .cap drops to a 2nd line */
.row.xs{min-height:40px;font-size:14px}
.row.s{min-height:48px;font-size:15px}
.row.m{min-height:56px;font-size:15px}
.row.l{min-height:64px;font-size:15px}
.row .g{flex:1;min-width:0}
.row .g .cap{display:block}
.row.minus{color:#1F7A33}
.row.free{background:repeating-linear-gradient(135deg,#F7FBF8 0 6px,#fff 6px 12px)}
.row.now{background:var(--jade-soft)}
/* Card with padding + stacked content */
.card.pad{padding:16px 18px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
/* Trend words */
.up{color:#1F7A33;font-weight:600;font-size:13px}
.down{color:#B5470A;font-weight:600;font-size:13px}
/* Stat: tappable KPI tile; stat-grid: numbers side by side inside a card */
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:16px;border:0;background:var(--paper);box-shadow:var(--shadow);font:inherit;text-align:left;cursor:pointer;color:var(--ink);box-sizing:border-box}
.stat.on{box-shadow:0 0 0 2px var(--ink),var(--shadow)}
.stat .v{font-size:26px;line-height:32px;font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.stat-grid{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px;text-align:center}
.stat-grid b{display:block;font-size:22px;line-height:28px;font-variant-numeric:tabular-nums}
/* Progress bar: .thin 6 · default 8 · .thick 10; .ink fill; .tint track on green cards */
.prog-bar{height:8px;border-radius:5px;background:var(--fill);overflow:hidden}
.prog-bar span{display:block;height:100%;background:var(--jade);border-radius:inherit}
.prog-bar.thin{height:6px}
.prog-bar.thick{height:10px}
.prog-bar.ink span{background:var(--ink)}
.prog-bar.tint{background:rgba(47,158,68,.18)}
/* Stepper: − value + */
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper .btn{width:36px;height:36px;padding:0}
.stepper b{min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
/* Message bubble: preview of a text the client gets */
.bubble{background:var(--fill);border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:14px;line-height:20px}
/* Data table: numbers right-aligned, first column left */
.dtable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.dtable th{height:36px;text-align:right;font-size:12px;font-weight:600;color:var(--ink-soft);padding:0 14px;border-bottom:1px solid var(--line)}
.dtable td{height:40px;text-align:right;padding:0 14px;border-bottom:1px solid var(--line)}
.dtable tr:last-child td{border-bottom:0}
.dtable th:first-child,.dtable td:first-child{text-align:left}
/* Mini bar chart: this period (ink) vs last (grey) */
.minibars{display:flex;align-items:flex-end;gap:10px;height:190px}
.minibars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.minibars .b i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--ink)}
.minibars .b i.last{background:#D1D1D6}
.minibars .b span{font-size:12px;color:var(--ink-soft)}
/* Phone tab bar (tech app): 64px, bottom */
.ptabs{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;border-top:1px solid var(--line);background:rgba(255,255,255,.92)}
.ptabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;font:inherit;font-size:11px;color:var(--ink-soft);cursor:pointer}
.ptabs button.on{color:var(--ink);font-weight:600}
/* Phone day timeline: 58px per hour; blocks share the calendar's states */
.dtl{position:absolute;left:0;right:0}
.dtl-h{position:absolute;left:12px;width:34px;font-size:11px;color:var(--ink-soft);transform:translateY(-7px)}
.dtl-line{position:absolute;left:52px;right:16px;height:1px;background:var(--line)}
.dtl-bk{position:absolute;left:56px;right:16px;border-radius:10px;padding:6px 10px;box-sizing:border-box;border:1px solid var(--line);background:var(--paper);font-size:13px;line-height:17px;overflow:hidden;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
.dtl-bk b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtl-bk .cap{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtl-bk.paid{background:var(--surface);color:var(--muted)}
.dtl-bk.chair{background:var(--jade-soft);border:1.5px solid var(--jade)}
.dtl-bk.unconf{background:repeating-linear-gradient(135deg,#FFF4EC 0 6px,#fff 6px 12px);border-color:#F4C9AF}
.dtl-bk.free{border-style:dashed;background:transparent;color:#1F7A33;font-weight:600}
.dtl-now{position:absolute;left:46px;right:16px;height:2px;background:var(--red)}

:root{--stage:#E9E9EE}
html,body{height:100%}
body{background:var(--stage);color:#1C1C1E;margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#fff;border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0;flex:1 1 220px;letter-spacing:-0.01em}
.top .cap{flex:1 1 100%}
.stage{display:flex;justify-content:center;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.frame{position:relative;transform-origin:top left;box-shadow:0 30px 80px rgba(28,28,30,.18);border-radius:18px;overflow:hidden;background:var(--surface)}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #2F9E44;outline-offset:2px}
.tag.warn{background:var(--orange-soft);color:#B5470A}.tag.bad{background:#FCE8E8;color:#C92A2A}.tag.grey{background:var(--fill);color:var(--ink-soft)}
.rail a{cursor:pointer;position:relative}
.badge{position:absolute;left:34px;top:2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.sh,.srow{display:grid;grid-template-columns:170px 104px 92px 118px 84px 1fr;gap:10px;align-items:center;padding:0 14px}
.sh{height:34px;font-size:12px;font-weight:600;color:var(--ink-soft);border-bottom:1px solid var(--line)}
.srow{min-height:54px;border:0;border-bottom:1px solid var(--line);background:#fff;font:inherit;font-size:14px;text-align:left;color:var(--ink);cursor:pointer;width:100%}
.srow:hover{background:#FAFAFB}
.srow .g{display:flex;flex-direction:column;line-height:18px;min-width:0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);animation:fadeIn .3s ease}
.alert:last-child{border-bottom:0}
.ic{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.ic.bad{background:#FCE8E8;color:#C92A2A}.ic.warn{background:var(--orange-soft);color:#B5470A}
.abtn{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.abtn.dark{background:var(--ink);border-color:var(--ink);color:#fff}.abtn:hover{border-color:#C7C7CC}
.hrow{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border-bottom:1px solid var(--line);font-size:15px}
.hrow:last-child{border-bottom:0}.hrow .k{width:150px;color:var(--ink-soft);font-size:14px;flex:none}.hrow .v{flex:1;min-width:0}
.lockbox{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:13px;color:var(--ink-soft)}
.support{box-shadow:0 0 0 2px var(--jade),var(--shadow)}
.logl{display:flex;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}.logl:last-child{border-bottom:0}.logl .t{width:64px;color:var(--ink-soft);flex:none}
.qr{width:92px;height:92px;flex:none;border-radius:10px;background:#fff;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px;box-sizing:border-box}
.qr i{background:var(--ink);border-radius:1px}.qr i.o{background:transparent}
.toastbox{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:20}
.pa{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:fadeIn .3s ease}
.pa .r{display:flex;gap:8px}.pa .r button{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.pa .r button.dark{background:var(--ink);border-color:var(--ink);color:#fff}

   <div class="group">${[['1 · Sign up','Opens the link from text or email · phone code (email code if no cell) · no password'],['2 · Salon made','Own salon_id (own data wall) · they become owner'],['3 · Defaults','Time zone, receipt, EN/VI, nail service template'],['4 · Setup checklist','10 steps start · progress shows on Salons']].map((r)=>`<div class="hrow"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('')}</div>
   <div class="group"><div class="hrow" style="font-weight:600">Invites<span class="cap" style="font-weight:400;margin-left:auto">Resend = new link, old one stops working</span></div>${S.invites.map((i)=>`<div style="display:flex;flex-direction:column;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)"><div style="display:flex;align-items:center;gap:8px"><span style="flex:1;min-width:0"><b>${esc(i.salon)}</b> <span class="cap">· ${esc(i.owner)} · ${esc(i.city)}</span></span><span class="tag ${i.status==='Expired'?'warn':i.status.startsWith('Signed')?'jade':'grey'}">${i.status}</span></div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span class="cap" style="flex:1;min-width:180px">Sent ${i.sent} by ${i.via.map((v)=>v==='text'?'text':'email').join(' + ')}${i.status==='Expired'?' · link ended':''}</span>${i.status.startsWith('Signed')?'':`${i.phone?`<button class="abtn" type="button" data-act="resend:${i.id}:text">Resend text</button>`:''}${i.email?`<button class="abtn" type="button" data-act="resend:${i.id}:email">Resend email</button>`:''}`}</div></div>`).join('')}</div>
  </div></main>`; }

function systemView(){ return `${bar('System (admin only)')}<main style="flex:1;display:flex;flex-direction:column;gap:14px;padding:18px 24px;min-height:0">
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">${[['Uptime · 30 days','99.98%','1 short blip Nov 9','cap'],['App errors · 24 h','7','5 salons · 0 lost data','cap'],['Stripe messages','1,284','0 failed · all matched','up'],['Our costs · Nov','$84','vs $98 income','cap']].map((k)=>`<div class="stat" style="cursor:default"><span class="cap">${k[0]}</span><span class="v">${k[1]}</span><span class="${k[3]}" style="font-size:12px">${k[2]}</span></div>`).join('')}</div>
  <div style="display:flex;gap:16px;flex:1;min-height:0"><div class="group" style="flex:1"><div class="hrow" style="font-weight:600">Running smooth checks</div>
   ${[['Backups','daily + point-in-time · restore test Nov 1','OK','tag jade'],['Data walls test','every change · 2 fake salons','Pass','tag jade'],['Sentry alerts','7 errors · 0 new types','OK','tag jade'],['Uptime checks','app + Stripe webhook','OK','tag jade'],['2-step login','Oliver ✓ · Elang ✓','OK','tag jade'],['Texting 10DLC','1 salon pending (Lily)','Wait','tag warn']].map((c)=>`<div class="hrow"><span class="v">${c[0]}</span><span class="cap">${c[1]}</span><span class="${c[3]}">${c[2]}</span></div>`).join('')}</div>
  <div class="group" style="width:360px;flex:none"><div class="hrow" style="font-weight:600">Costs this month</div>${[['Supabase','$25'],['Vercel','$20'],['Twilio (texts + numbers)','$31'],['Sentry','$0'],['Domain + email','$8'],['Stripe','$0 · salons pay their fees']].map((c)=>`<div class="hrow"><span class="v">${c[0]}</span><b>${c[1]}</b></div>`).join('')}<div class="hrow"><span class="v cap">Spending alerts on every service</span></div></div></div></main>`; }

function phone(){ return `<div class="phone" style="position:relative"><div class="pbar" style="justify-content:space-between;padding:0 16px"><span style="width:32px"></span><span>Admin · Alerts</span><span class="av">E</span></div>
  <div style="flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 16px 80px;overflow:auto">
   <div style="display:flex;align-items:baseline;gap:8px"><b style="font-size:20px;flex:1">${S.alerts.length} to call</b><span class="cap">${S.salons.length} salons</span></div>
   ${S.alerts.map((a)=>{const s=byId(a[1]);return `<div class="pa"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">${esc(s.name)}</b><span class="${s.health[1]}">${s.health[0]}</span></div><div style="font-size:15px;line-height:20px">${a[4]}</div><div class="r"><button class="dark" type="button" data-act="call:${s.id}">Call ${esc(s.owner.split(' ')[0])}</button><button type="button" data-act="handled:${a[0]}">Handled</button></div></div>`;}).join('')||'<div class="cap" style="text-align:center;padding:24px">All clear ✓</div>'}
  </div><div class="ptabs"><button type="button" class="on">Alerts</button><button type="button" data-act="dev:desk">Salons</button><button type="button" data-act="devnew">Add salon</button></div>
  ${S.toast?`<div class="toast"><span style="flex:1">${S.toast}</span></div>`:''}</div>`; }

function screen(){ if (S.dev==='phone') return phone();
  if (S.view==='system'&&S.role!=='oliver') S.view='salons';
  const v={salons:salonsView,salon:salonView,new:newView,system:systemView}[S.view]();
  return `<div class="app">${rail()}<div class="col" style="position:relative">${v}${S.toast?`<div class="toastbox"><div class="toast" style="position:static;transform:none"><span>${S.toast}</span></div></div>`:''}</div></div>`; }
function fit(){ const f=$('#frame'),h=$('#holder'),w=S.dev==='phone'?390:1280,ht=S.dev==='phone'?844:800,sc=Math.min(1,(window.innerWidth-32)/w); f.style.width=w+'px'; f.style.height=ht+'px'; f.style.transform='scale('+sc+')'; h.style.width=w*sc+'px'; h.style.height=ht*sc+'px'; }
function render(){ const a=document.activeElement, keep=a&&a.getAttribute&&(a.getAttribute('data-in')||a.getAttribute('data-form')), pos=keep?a.selectionStart:0;
  $('#frame').innerHTML=screen(); $('#t-desk').className=S.dev==='desk'?'on':''; $('#t-phone').className=S.dev==='phone'?'on':''; fit();
  if (keep){ const n=document.querySelector(`[data-in="${keep}"],[data-form="${keep}"]`); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } } }
function addLog(id,t){ (S.log[id]=S.log[id]||[]).push([now(),t]); }
function act(x){ const i=x.indexOf(':'), k=i<0?x:x.slice(0,i), v=i<0?'':x.slice(i+1);
  if (k==='dev') S.dev=v; else if (k==='devnew'){ S.dev='desk'; S.view='new'; }
  else if (k==='restart') reset();
  else if (k==='go'){ S.view=v; S.noteDraft=''; }
  else if (k==='role'){ S.role=v; toast(v==='oliver'?'Signed in as Oliver (admin): System tab shows.':'Signed in as Elang (support).'); return; }
  else if (k==='filter') S.filter=v;
  else if (k==='open'){ S.sel=v; S.view='salon'; S.dev='desk'; S.noteDraft=''; }
  else if (k==='handled'){ const a=S.alerts.find((z)=>z[0]===v); S.alerts=S.alerts.filter((z)=>z[0]!==v); toast('Marked handled · '+byId(a[1]).name+' (logged)'); return; }
  else if (k==='call'){ const s=byId(v); toast('Calling '+s.owner+' · '+s.phone+' …'); return; }
  else if (k==='textvi'){ toast('Text in Vietnamese sent to '+byId(v).owner.split(' ')[0]); return; }
  else if (k==='stripe'){ toast('Stripe link sent to '+byId(v).owner.split(' ')[0]+'. They finish ID on their phone.'); return; }
  else if (k==='ask'){ S.access[v]='wait'; toast('Request sent to '+byId(v).owner.split(' ')[0]+' by text + in their app'); return; }
  else if (k==='cancelAsk') S.access[v]='none';
  else if (k==='allow'){ const s=byId(v); S.access[v]='on'; S.left[v]='23 h 59 m'; S.log[v]=[]; addLog(v,s.owner.split(' ')[0]+' allowed support for 24 h'); }
  else if (k==='fix'){ const s=byId(v); if (s.id==='golden'&&s.reader[1][0]==='Offline'){ addLog(v,'Elang re-paired reader “Front desk”'); s.reader=['S710 “Front desk” · online',OK]; s.errors=['0',OK]; s.health=['Good','tag jade']; S.alerts=S.alerts.filter((a)=>a[1]!=='golden'); render(); setTimeout(()=>{ addLog(v,'Reader online ✓'); toast('Reader back online · alert cleared'); },700); return; } addLog(v,'Elang opened Today screen'); }
  else if (k==='endSupport'){ S.access[v]='none'; addLog(v,'Support ended by Elang'); toast('Support mode off. The log stays with the owner.'); return; }
  else if (k==='addNote'){ if (!S.noteDraft.trim()) return; const d=new Date(); byId(v).notes.unshift(['Nov 16 · '+now(),S.noteDraft.trim()]); S.noteDraft=''; }
  else if (k==='plan') S.plan=v;
  else if (k==='via'){ const n=Object.assign({},S.via); n[v]=!n[v]; if(!n.text&&!n.email){ toast('Pick at least one: text or email'); return; } S.via=n; }
  else if (k==='resend'){ const [id,ch]=v.split(':'); const i=S.invites.find((z)=>z.id===id); i.sent='Nov 16 · '+now(); if(!i.via.includes(ch)) i.via.push(ch); if(i.status==='Expired') i.status='Not opened';
    if (S.invite&&S.invite.id===id) S.invite.code='Q'+Math.random().toString(36).slice(2,6).toUpperCase();
    toast('New link '+(ch==='text'?'texted to '+i.phone:'emailed to '+i.email)+'. The old link stops working.'); return; }
  else if (k==='makeInvite'){ const f=S.form, ph=f.p.replace(/\D/g,'').length===10, em=/.+@.+\..+/.test(f.e||'');
    if (!f.n.trim()){ toast('Add the salon name'); return; }
    if (S.via.text&&!ph){ toast('Add a 10-digit cell to send by text'); return; }
    if (S.via.email&&!em){ toast('Add an email to send by email'); return; }
    const via=['text','email'].filter((c)=>S.via[c]), id='i'+Date.now();
    S.invite={id,code:'Q'+Math.random().toString(36).slice(2,6).toUpperCase(),o:f.o,p:S.via.text?f.p:'',e:S.via.email?f.e:'',via};
    S.invites.unshift({id,salon:f.n,owner:f.o,city:f.st,phone:S.invite.p,email:S.invite.e,via,sent:'Nov 16 · '+now(),status:'Not opened'});
    toast('Invite sent by '+via.join(' + ')+' to '+f.o);
    S.salons.push({id:'n'+Date.now(),name:f.n,city:f.st,plan:'Invited',setup:0,today:'—',month:'—',owner:f.o,phone:f.p,since:'—',stripe:['Not yet','tag grey','—'],text:['Not yet','tag grey','—'],reader:['—',['—','tag grey']],printer:['—',['—','tag grey']],devices:['—',['—','tag grey']],errors:['—',['—','tag grey']],health:['Invite sent','tag grey'],notes:[]}); }
  else if (k==='sendInvite'){ S.invite.sent=true; toast('Invite texted to '+S.invite.o+' · shows on Salons as “Invite sent”'); return; }
  else if (k==='copy'){ toast('Link copied'); return; }
  else if (k==='another'){ S.invite=null; S.form={n:'',st:'',o:'',p:'',e:''}; }
  render(); }
setInterval(()=>{ let ch=false; for (const id in S.access){ if (S.access[id]==='on'){ const [h,m]=S.left[id].match(/\d+/g).map(Number); const t=h*60+m-1; S.left[id]=Math.floor(t/60)+' h '+String(t%60).padStart(2,'0')+' m'; ch=true; } } if (ch&&!document.activeElement.matches('input')) render(); },60000);
document.addEventListener('click',(e)=>{ const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; e.preventDefault(); act(el.getAttribute('data-act')); });
document.addEventListener('keydown',(e)=>{ if ((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=tab][data-act],[role=button][data-act]')){ e.preventDefault(); act(e.target.getAttribute('data-act')); } if (e.key==='Enter'&&e.target.matches('[data-in="noteDraft"]')){ act('addNote:'+S.sel); } });
document.addEventListener('input',(e)=>{ const k=e.target.getAttribute('data-in'); if(k){ S[k]=e.target.value; if(k==='q') render(); } const f=e.target.getAttribute('data-form'); if(f) S.form[f]=e.target.value; });
window.addEventListener('resize',fit);
render();
</script>
