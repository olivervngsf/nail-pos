<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One salon: health only</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Admin" view="salon" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="8"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · A2</div>
    <div class="af-title">One salon: health only</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="8"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Owner-granted only (System Design “Founder Admin”, issue #21).</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[105, 95, "‹ Salons goes back to the list."], [105, 176, "Totals only: tickets and $. No client names, no tech pay."], [105, 305, "Health rows: Stripe account, card reader, printer, salon devices, texting, app errors. Red / orange = act now."], [105, 540, "Call notes: what Elang and the owner said. Visible to us only."], [914, 125, "Support access is OFF by default."], [918, 198, "Ask Tom for 24-hour access → he gets a text + a prompt in his app (A3)."], [912, 272, "Hidden by default: client names + phones, each tech’s pay, notes."], [918, 378, "Quick actions: call, text in Vietnamese, resend Stripe link, add a call note."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
