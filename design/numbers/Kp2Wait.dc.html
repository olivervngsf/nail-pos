<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tap a KPI → its story</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Main" kpi="wait" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="3"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · K2 · Owner</div>
    <div class="af-title">Tap a KPI → its story</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="3"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Back to K1 by tapping another KPI</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[1046, 128, "Picked KPI gets an ink ring; the chart below switches with a soft fade."], [112, 214, "Walk-in wait by day: Saturday stands out."], [112, 488, "The fact names the cause and the lever (one more tech Sat midday). Owner decides."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), zero: 0, three: 3, yes: true, no: false, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
