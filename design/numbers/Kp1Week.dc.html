<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Numbers: the week at a glance</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Main" kpi="sales" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="6"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · K1 · Owner</div>
    <div class="af-title">Numbers: the week at a glance</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="6"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Tap any KPI → K2</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[112, 128, "Top 5 KPIs (PRD): Sales, Avg ticket, Came back (+ lost regulars), Sales per staff hour, Walk-in wait (+ walk-outs). Each vs the same period before; green = better, orange = worse, word + arrow, never colour alone."], [800, 28, "Today / This week / This month. Compare line follows (vs last Monday / last week / last month). Export = CSV for the accountant."], [112, 214, "Chart for the picked KPI: this period (ink) vs last (grey), by day."], [112, 488, "One plain fact under the chart, the thing to act on. Facts only, no auto-actions."], [868, 214, "More numbers: rebooked before leaving, no-shows ($ lost), new clients (+ source), tips (all to staff), card fees, gift cards, busiest time."], [112, 552, "Per staff: sales, hours, $/hour, avg ticket, rebook %, tips, turns. Owner + manager only; techs see only their own row on their phone."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), zero: 0, three: 3, yes: true, no: false, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
