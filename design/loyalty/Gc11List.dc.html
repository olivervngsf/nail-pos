<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All codes: sold or not, used or not</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="GiftList"  hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="7"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · G11 · Owner</div>
    <div class="af-title">All codes: sold or not, used or not</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="7"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Make codes for printing → G12</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[112, 94, "Filter by status with counts: Active (sold, money left) · In stock (not sold, $0) · Used up · Locked / replaced."], [112, 180, "Each card: last 4 only, digital or plastic, who made it (always the system, or the owner for migrated paper)."], [112, 340, "In stock = printed but not sold: worth $0."], [112, 420, "Used up = balance $0, kept forever for history."], [112, 500, "Locked = reported lost; Replaced points to the new card."], [112, 580, "Old paper certificate added once by the owner (logged)."], [112, 760, "Totals: money owed on active cards, stock left. Export CSV for the accountant."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), zero: 0, three: 3, yes: true, no: false, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
