<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gift card settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="GiftSetup" mode="settings" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="8"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · G1 · Owner</div>
    <div class="af-title">Gift card settings</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="8"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">+ Add plastic cards → G2</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[112, 108, "Turn on: “+ Gift card” appears at checkout. Owner PIN."], [112, 210, "Amounts the front desk sees as one-tap chips."], [112, 338, "Never expires (our rule, locked)."], [112, 386, "Cash back for small balances follows the salon's state (e.g. California under $10 if asked)."], [530, 524, "Plastic cards: how many blank cards are in stock / sold. Add more from a new box."], [728, 214, "Digital card preview: the code is made by the system at the sale."], [728, 420, "Money owed on cards = unused balances (the salon owes this as services)."], [728, 540, "Find a card by phone or last 4: balance, history, lost card (G10)."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), zero: 0, three: 3, yes: true, no: false, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
