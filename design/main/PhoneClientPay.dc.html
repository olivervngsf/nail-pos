<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Client pays</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tip{height:60px;border-radius:14px;border:0;background:#FFFFFF;box-shadow:0 0.5px 0 rgba(0,0,0,.04),0 2px 8px rgba(28,28,30,.06);font:inherit;font-size:16px;font-weight:600;color:#1C1C1E;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:background .25s,color .25s,transform .15s}
.tip:active{transform:scale(.97)}
.tip.on{background:#1C1C1E;color:#FFFFFF}
.tip .s{font-size:12px;font-weight:500;opacity:.7}
</style>
</helmet>
<div class="phone">
  <div class="pbar">Mai Nails</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:16px;padding:20px">
    <div class="group in">
      <div class="row"><div class="grow">Gel manicure <span class="cap">· Kim</span></div><span class="num">$35.00</span></div>
      <div class="row"><div class="grow">Deluxe pedicure <span class="cap">· Ngọc</span></div><span class="num">$55.00</span></div>
      <div class="row"><div class="grow">Regular discount</div><span class="num">−$5.00</span></div>
      <div class="row"><div class="grow">Gift card ••4821</div><span class="num">−$20.00</span></div>
    </div>
    <div class="in2">
      <div class="h2" style="margin-bottom:10px">Add a tip</div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <sc-for list="{{tips}}" as="t" hint-placeholder-count="6">
          <button class="{{t.cls}}" type="button" onClick="{{t.pick}}"><span>{{t.label}}</span><span class="s num">{{t.sub}}</span></button>
        </sc-for>
      </div>
      <div class="cap" style="margin-top:10px">100% of your tip goes to Kim and Ngọc.</div>
    </div>
    <div style="flex:1"></div>
    <div class="line in3" style="font-size:17px"><span>Total</span><span class="money fade" style="font-size:30px">{{total}}</span></div>
    <a class="btn primary block" href="PhoneClientReceipt.dc.html" style="background:#000">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.1-1.2 2.9-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.5-1-2.4-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4z"/></svg>
      Pay
    </a>
    <a class="btn block" href="PhoneClientReceipt.dc.html">Pay with card</a>
    <div class="cap" style="text-align:center">Secured by Stripe · Google Pay on Android</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { pick: 4 }; }
  renderVals() {
    const base = 65;
    const opts = [
      { label: '18%', amt: 11.70 }, { label: '20%', amt: 13.00 }, { label: '25%', amt: 16.25 },
      { label: 'No tip', amt: 0 }, { label: 'Custom', amt: 18.00 }, { label: '$10', amt: 10 }
    ];
    const tips = opts.map((o, i) => ({
      label: o.label,
      sub: o.amt ? '$' + o.amt.toFixed(2) : '—',
      cls: this.state.pick === i ? 'tip on' : 'tip',
      pick: () => this.setState({ pick: i })
    }));
    return { tips, total: '$' + (base + opts[this.state.pick].amt).toFixed(2) };
  }
}
</script>
</body>
</html>
