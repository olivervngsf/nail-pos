<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clients: profile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Clients" filter="all" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="9"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · C1</div>
    <div class="af-title">Clients — list + profile (CRM)</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="9"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Client list belongs to the salon; never shared.</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[110, 100, "Search by phone or name."], [110, 150, "Filters: Regulars, Lost regulars, New, Birthdays, Gift card balance."], [110, 270, "Rows: name, tag, usual service + staff, last visit. Tap → profile on the right."], [436, 90, "Header: phone, texts consent, birthday · Text · Book · New ticket."], [436, 200, "Stats: visits, spent, avg ticket, how often, avg tip, no-shows."], [436, 300, "Likes: usual staff, shape, colors (Edit)."], [436, 405, "Allergy / care in red — shows on every ticket for this client."], [860, 300, "Nail photos from past visits (+ Add)."], [860, 450, "Visits list + next booking."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
