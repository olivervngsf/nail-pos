<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today: owner</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Main" kpi="sales" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="7"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · H1</div>
    <div class="af-title">Today — owner home</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="7"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Facts only — you decide.</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[150, 212, "Top 5 KPIs (PRD): sales vs last week, avg ticket, came back + lost regulars, sales per staff hour, walk-in wait + walk-outs. Tap one → chart below switches (fade)."], [170, 312, "Chart: today (black) vs same day last week (grey), by hour. Bars grow in (0.6 s)."], [170, 528, "One plain-words fact under every chart."], [150, 845, "Staff right now: status dot, $ today, turns."], [1062, 186, "In chair · waiting · booked later."], [1062, 300, "Needs attention: late staff, not confirmed, ready for bill, license expiring, birthdays. One-tap action; done items slide away. Empty = “Nothing needs you right now”."], [990, 104, "Owner / Front desk: front desk version hides sales $."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
