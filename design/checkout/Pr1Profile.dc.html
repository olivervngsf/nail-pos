<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile: add photo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="afp">
  <div class="afp-screen">
    <dc-import name="Profile"  hint-size="390px,844px"></dc-import>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="3"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for>
  </div>
  <aside class="af-notes">
    <div class="eyebrow">Annotations · P5·1</div>
    <div class="af-title">My profile — no photo yet</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="3"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Next → P5·2 photo options.</div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":750,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [[232, 92, "Tap the circle (camera badge) to add a photo. Anyone — owner, manager, front desk, staff — can set their own."], [195, 182, "“Add photo” text link does the same."], [40, 300, "Language switch stays right under it."]];
    return { yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
