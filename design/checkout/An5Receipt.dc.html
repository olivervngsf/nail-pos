<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: client receipt</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="afp">
  <div class="afp-screen">
    <dc-import name="PhoneClientReceipt"  hint-size="390px,844px"></dc-import>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="4"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for>
  </div>
  <aside class="af-notes">
    <div class="eyebrow">Annotations · P3</div>
    <div class="af-title">Client receipt (text)</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="4"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Saved to the client profile.</div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":750,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [[195, 90, "✓ pops + “Thank you, Lan!” + total."], [40, 330, "Full receipt: services, discount, gift card left, tip, card."], [195, 650, "Book next visit → booking link with their usual staff pre-picked."], [195, 800, "“Reply STOP to stop texts.” Only sent to clients who said yes."]];
    return { yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
