<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: client pays</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="afp">
  <div class="afp-screen">
    <dc-import name="PhoneClientPay"  hint-size="390px,844px"></dc-import>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="5"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for>
  </div>
  <aside class="af-notes">
    <div class="eyebrow">Annotations · P2</div>
    <div class="af-title">Client picks tip + pays (English)</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="5"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Secured by Stripe; we never see the card.</div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":750,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [[40, 120, "Every line: services by staff, discount, gift card — nothing hidden."], [40, 370, "Tip buttons 3×2: tap one → black; total updates with a fade. “100% of your tip goes to Kim and Ngọc.”"], [300, 620, "Total, large."], [195, 680, "Apple Pay (iPhone) / Google Pay (Android) → wallet sheet → P3."], [195, 730, "Pay with card → card form."]];
    return { yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
