<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticket: discount drawer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Main" scenario="discount" hint-size="1280px,800px"></dc-import>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="5"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for>
  </div>
  <aside class="af-notes">
    <div class="eyebrow">Annotations · 1e</div>
    <div class="af-title">Discount</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="5"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Commission on discounted vs full price = owner setting (shown in drawer).</div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [[860, 120, "Amount chips: $5, $10, 10%, 15%. Selected = black."], [1240, 160, "“Takes off” shows the exact $ before applying."], [860, 230, "Reason chips: Regular client, Birthday, Fix / redo, Other — saved for the owner report."], [860, 292, "Manager PIN — 4 dots fill per tap; “Manager OK ✓” at 4."], [1060, 744, "Apply discount stays grey until the PIN is in. Then the line appears in the total."]];
    return { one: 1, two: 2, four: 4, yes: true, hundred: 100, sixty: 60, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
