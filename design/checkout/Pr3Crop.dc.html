<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile: move and scale</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="afp">
  <div class="afp-screen">
    <dc-import name="Profile" photoStep="crop" hint-size="390px,844px"></dc-import>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="3"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for>
  </div>
  <aside class="af-notes">
    <div class="eyebrow">Annotations · P5·3</div>
    <div class="af-title">Move and scale</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="3"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Owner/manager can also set a staff photo from that person&#x27;s detail (with their OK).</div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":750,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [[300, 300, "Round crop window; pinch to zoom, drag to center the face."], [350, 26, "Use photo → saves."], [40, 26, "Cancel → back, nothing saved."]];
    return { yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
