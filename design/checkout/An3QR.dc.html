<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: QR to pay</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="afp">
  <div class="afp-screen">
    <dc-import name="PhoneQR"  hint-size="390px,844px"></dc-import>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="5"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for>
  </div>
  <aside class="af-notes">
    <div class="eyebrow">Annotations · P1</div>
    <div class="af-title">Salon phone shows QR</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="5"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Client side → P2.</div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":750,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [[195, 110, "Amount + “tip the client picks”."], [195, 300, "Big QR (220 px). Client scans with their own phone camera."], [120, 450, "Pulsing orange dot: waiting. Turns to Paid by itself when the client pays."], [195, 700, "Text pay link → sends the same link to the client's phone."], [195, 752, "Fee note: 2.9% + 30¢, salon pays. Use when the reader is down."]];
    return { yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
