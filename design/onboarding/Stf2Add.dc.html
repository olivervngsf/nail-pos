<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff: add form</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="setup.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Staff" scenario="add" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="6"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · 4b</div>
    <div class="af-title">Add staff form</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="6"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Next → 4c if the phone is wrong, or 4d after “Add + text invite”.</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [
      [822, 128, 'Name + cell phone side by side. Phone is checked as you type (10 digits, not already on team).'],
      [822, 200, 'Role: Front desk / Nail staff / Manager. Decides what they can see and do.'],
      [822, 262, 'Pay type segmented control. Switching resets the rate to that type’s default (60% · $16.50/hr · $250/wk).'],
      [1190, 320, 'Stepper − / +: commission ±5% (30–80), hourly ±$0.50, rent ±$25. Note under it explains the rule.'],
      [1190, 420, '“Add + text invite” — grey until name + valid phone. Tap → form closes, new row appears (4d).'],
      [1190, 74, 'Cancel → back to team list, nothing saved.']
    ];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
