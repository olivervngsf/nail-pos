<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Services: import from website link</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="setup.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Services" mode="link" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="8"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · 3f</div>
    <div class="af-title">Imported from your website link</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="8"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Build: fetch the page → AI extracts name, price, price type (fixed / from / add-on / package), group; guesses times; owner confirms.</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[350, 90, "One line says what we found and from where. Nothing is saved until the owner taps “Looks right · Continue”."], [350, 172, "Summary chips: what AI was unsure about (orange) and how it organized things (grey). Based on a real salon menu: no times listed, two-price table, “$45+” prices, combos, a “$7 Extra” add-on, waxing."], [366, 248, "Grouped by the salon’s own categories, with counts."], [676, 438, "Combo (“Gel manicure & gel pedicure”) becomes a package of 2 services at one price."], [888, 540, "“$7 Extra” becomes an add-on at +$7."], [872, 619, "Two-price rows (Full set $48 / Fill-in $38) split into 2 services."], [1022, 335, "Every name, minutes and price is editable. Orange minutes = time guessed. “Special events — no price” is not imported; add later."], [1062, 123, "Use another way → back to choose (photo or template)."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
