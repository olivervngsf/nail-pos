<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Salon info</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="setup.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="wiz">
  <aside class="side">
    <div class="brand"><div class="logo" style="margin:0">N</div>Salon setup</div>
    <div class="prog"><span style="{{pct}}"></span></div>
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="10">
      <div class="{{s.cls}}"><span class="n">{{s.n}}</span>{{s.label}}</div>
    </sc-for>
    <div class="help">About 1 hour. Everything saves as you go — stop anytime and come back.</div>
  </aside>
  <div class="main">
    <div class="body">
      <div class="eyebrow in">Step 2 of 10</div>
      <div class="h1 in">About your salon</div>
      <div class="in2" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:820px">
        <div><label class="lbl" for="nm">Salon name</label><input class="inp" id="nm" value="Mai Nails"></div>
        <div><label class="lbl" for="sp">Salon phone (clients see this)</label><input class="inp num" id="sp" value="(408) 555-0100"></div>
        <div style="grid-column:span 2"><label class="lbl" for="ad">Address</label><input class="inp" id="ad" value="1234 Story Rd, San Jose, CA 95122"></div>
      </div>
      <div class="in2">
        <div class="lbl">Open days</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span class="chip on">Mon</span><span class="chip on">Tue</span><span class="chip on">Wed</span><span class="chip on">Thu</span><span class="chip on">Fri</span><span class="chip on">Sat</span><span class="chip">Sun</span>
          <span class="cap" style="align-self:center;margin-left:8px">9:30 AM – 7:00 PM · change per day later</span>
        </div>
      </div>
      <div class="in3">
        <div class="lbl">Which state?</div>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <sc-for list="{{states}}" as="s" hint-placeholder-count="4">
            <button class="{{s.cls}}" type="button" onClick="{{s.pick}}">{{s.label}}</button>
          </sc-for>
        </div>
        <div class="card fade" style="padding:16px 18px;display:flex;gap:14px;align-items:flex-start;max-width:820px">
          <div class="ico" style="flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div>
          <div>
            <div style="font-weight:600;font-size:16px">{{ruleTitle}}</div>
            <div class="cap" style="font-size:14px;line-height:20px;margin-top:2px">{{ruleBody}}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="foot">
      <a class="btn ghost" href="Main.dc.html">Back</a>
      <span class="sp"></span>
      <span class="pill ok"><span class="dot"></span>Saved</span>
      <a class="btn primary" href="Services.dc.html" style="width:200px">Continue</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { st: 'CA' }; }
  renderVals() {
    const cur = 1;
    const names = ['Sign up','Salon info','Services','Staff + PIN','Payments','Card reader','Printer','Salon device','Clients','$1 test'];
    const locked = this.state.st === 'CA' || this.state.st === 'MN';
    return {
      steps: names.map((label, i) => ({ label, n: i < cur ? '✓' : String(i + 1), cls: i < cur ? 'st done' : (i === cur ? 'st now' : 'st') })),
      pct: 'width:' + Math.round((cur + 0.5) / 10 * 100) + '%',
      states: ['CA', 'TX', 'MN', 'Other'].map((s) => ({ label: s === 'CA' ? 'California' : s === 'TX' ? 'Texas' : s === 'MN' ? 'Minnesota' : 'Other state', cls: this.state.st === s ? 'chip on' : 'chip', pick: () => this.setState({ st: s }) })),
      ruleTitle: locked ? 'Tip rules locked by state law' : 'Tip rules set to our safe default',
      ruleBody: locked
        ? 'Staff always get 100% of tips. The card fee on tips is paid by the salon and can’t be changed here. Owners and managers are never in tip pools.'
        : 'Staff get 100% of tips and the salon pays the card fee on tips. You can change who pays that fee later in Settings — it always shows on the ticket.'
    };
  }
}
</script>
</body>
</html>
