<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open hours per day</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="setup.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Info" at="main" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="5"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · 2a</div>
    <div class="af-title">Open hours per day</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="5"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Tap a time → 2b time picker. Wrong times → 2c.</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[790, 193, "One row per day: switch, opens, closes, hours. Default 9:30 AM – 7:00 PM Mon–Sat."], [1018, 144, "“Copy Monday to all open days” sets every open day in one tap."], [1170, 193, "Hours per day shown, so a mistake stands out."], [790, 537, "Switch off → “Closed”. The booking page hides that day."], [780, 590, "Hours feed the booking page, calendar and reminders. Holidays + one-off days later in Settings · Hours."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
