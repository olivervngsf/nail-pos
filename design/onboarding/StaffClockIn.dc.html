<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First clock-in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.big{width:220px;height:220px;border-radius:50%;border:0;font:inherit;font-size:24px;font-weight:700;letter-spacing:-0.02em;cursor:pointer;transition:transform .2s var(--ease),background .4s,box-shadow .4s}
.big:active{transform:scale(.97)}
.big.in{background:#1C1C1E;color:#fff;box-shadow:0 20px 40px rgba(28,28,30,.25)}
.big.out{background:#fff;color:#1C1C1E;box-shadow:0 0 0 2px #2F9E44,0 10px 30px rgba(28,28,30,.08)}
</style>
</helmet>
<div class="phone">
  <div class="pbar" style="justify-content:space-between;padding:0 16px">
    <span style="width:32px"></span><span>Mai Nails</span><div class="av">K</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:22px;padding:32px 20px">
    <div class="in" style="text-align:center">
      <div class="cap">Monday, Nov 16</div>
      <div class="money" style="font-size:44px;line-height:50px">9:28 AM</div>
    </div>
    <button class="{{btnCls}}" type="button" onClick="{{toggle}}">{{btnLabel}}</button>
    <sc-if value="{{on}}" hint-placeholder-val="{{false}}">
      <div class="fade" style="width:100%;display:flex;flex-direction:column;gap:12px">
        <div class="group">
          <div class="row"><div class="grow">Clocked in</div><span class="num">9:28 AM</span></div>
          <div class="row"><div class="grow">Your turn</div><span class="tag jade">#3 in line</span></div>
          <div class="row"><div class="grow">First appointment</div><span class="cap">10:30 · Lan Tran</span></div>
        </div>
        <div class="cap" style="text-align:center">Break? Tap the button again to clock out.</div>
      </div>
    </sc-if>
    <sc-if value="{{off}}" hint-placeholder-val="{{true}}">
      <div class="cap fade" style="text-align:center;font-size:15px;line-height:21px;max-width:280px">Welcome, Kim! Clock in to join today's turn list.</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"on":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { on: !!(p && p.on) }; }
  renderVals() {
    const on = this.state.on;
    return {
      on, off: !on,
      btnCls: on ? 'big out' : 'big in',
      btnLabel: on ? 'Clocked in ✓' : 'Clock in',
      toggle: () => this.setState({ on: !on })
    };
  }
}
</script>
</body>
</html>
