<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Services: check what AI read</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="setup.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Services" mode="ai" hint-size="1280px,800px"></dc-import>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="6"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for>
  </div>
  <aside class="af-notes">
    <div class="eyebrow">Annotations · 3d</div>
    <div class="af-title">Check what AI read</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="6"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Nothing is saved or live until “Looks right · Continue” → Step 4 Staff.</div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [
      [372, 198, 'Switch: turn a service off → row dims to 45%, count below updates.'],
      [600, 198, '“read as …” shows the original words from the photo so the owner can trust the match.'],
      [1010, 380, 'Orange ▲ tag = AI unsure (e.g. “50+” price, guessed time). Tells exactly what to check.'],
      [1150, 410, 'Price field turns orange for unsure rows; tap → number pad.'],
      [1190, 100, 'Retake photo → back to 3a.'],
      [1190, 762, 'Continue label becomes “Looks right · Continue”.']
    ];
    return { pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
