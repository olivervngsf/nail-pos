<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Services: check what AI read</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="setup.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Services" mode="ai" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="9"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · 3d</div>
    <div class="af-title">Check what AI read</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="9"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Nothing is saved or live until “Looks right · Continue” → Step 4 Staff.</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[350, 118, "Everything is editable: tap a name, minutes or price and type over it."], [372, 167, "Switch: turn a service off → row dims, count below updates."], [437, 184, "“read as …” shows the original words from the photo so the owner can trust the match."], [716, 379, "Orange ▲ tag = AI unsure (e.g. “50+” price, guessed time). Says exactly what to check."], [1066, 405, "The unsure box turns orange: price (“50+”) or minutes (time guessed). Fix it → orange goes away."], [1180, 194, "✕ removes a service from the list (undo with a toast)."], [356, 600, "+ Add a service adds a blank row, cursor in the name."], [1090, 92, "Retake photo → back to 3a."], [964, 736, "Continue label becomes “Looks right · Continue”."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
