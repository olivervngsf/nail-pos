<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Services: choose</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="setup.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Services" mode="choose" hint-size="1280px,800px"></dc-import>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="4"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for>
  </div>
  <aside class="af-notes">
    <div class="eyebrow">Annotations · 3a</div>
    <div class="af-title">Choose how to add services</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="4"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Next → 3b (snap) or 3e (template).</div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [
      [372, 170, 'Snap your menu (main choice, black border). Tap → camera, or upload a photo / PDF → 3b. Lifts on hover.'],
      [430, 330, '“Fastest · ~1 min” tag sets expectations.'],
      [810, 170, 'Start from a nail template → template list (3e).'],
      [30, 700, 'Side tip: a photo of the wall price board works; every price is checked before saving.'],
      [1190, 762, 'Continue is grey until a service list exists.']
    ];
    return { pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
