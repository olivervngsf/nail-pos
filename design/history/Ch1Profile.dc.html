<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Client profile + history</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Client" open="{{zero}}" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="9"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · H1 · Front desk · owner</div>
    <div class="af-title">Client profile + history</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="9"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Tap a visit → H2</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[112, 96, "Who: name, phone + email, tags (Regular, usual service, usual tech, since). Texts consent + language."], [112, 276, "4 facts: visits, total spent, avg ticket, how often she comes. Feeds lost-regular alerts."], [112, 348, "Notes every staff sees at checkout and on their phone. Allergies first, in red words."], [112, 478, "Gift card balance + loyalty points; reward ready shows as a green tag."], [112, 590, "Next booking, if any."], [508, 94, "Filter the history: all, photos, notes, payments, texts."], [508, 156, "Visit rows, newest first: date, tech, services, total + tip. Tap = open."], [600, 214, "Open visit: nail photos (anyone on staff can add), the tech's note, how it was paid with tip + card fee shown."], [1170, 28, "Book again opens the quick-book card with her usual service + tech already picked."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), zero: 0, three: 3, yes: true, no: false, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
