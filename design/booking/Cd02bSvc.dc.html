<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: quick book card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="afw">
  <div class="afw-screen">
    <dc-import name="Cal" scenario="createsvc" hint-size="1440px,900px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="4"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · D2b</div>
    <div class="af-title">Long service list → top 4 + full list</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="4"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">4 taps: slot → client → service → Book.</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1800,"height":900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[722, 634, "Card shows only the TOP 4 services for this client (her usual first) + “All 15 ›”. Real menus have 40+; the card never grows."], [1070, 380, "All services opens a list beside the card (card stays). Search: type 2 letters → matches across names (gel, pedi…)."], [1070, 443, "Category tabs: All · Manicure · Pedicure · Enhancements · Add-ons. Grouped list with length + price."], [1070, 535, "Her usual is tagged. Tap a service → it's picked, length updates, list closes."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
