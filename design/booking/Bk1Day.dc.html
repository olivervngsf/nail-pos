<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Booking: day calendar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="Main" scenario="day" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="8"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · B1</div>
    <div class="af-title">Day calendar</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="8"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Tap a booking → details (B7).</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[140, 78, "One column per staff with today's hours. Facts only — no auto-assigning."], [100, 172, "Time down the left; red line = now (1:40 PM)."], [560, 560, "Tap any empty spot → quick-add opens at that time for that staff (B2)."], [140, 415, "Status by look + words: green = confirmed, black border = in chair, grey = paid, orange = not confirmed."], [575, 280, "“▲ Not confirmed” — no reply to the reminder yet."], [575, 700, "Striped = off shift (Tuyết leaves at 5, Linh starts at 11). Can't book there."], [1020, 90, "Walk-ins waiting with wait time — so the desk sees gaps vs. walk-ins at a glance."], [1020, 240, "Salon's booking link: copy, or print a QR for the counter."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
