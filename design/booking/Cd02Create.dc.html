<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: quick book card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="afw">
  <div class="afw-screen">
    <dc-import name="Cal" scenario="create" hint-size="1440px,900px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="6"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · D2</div>
    <div class="af-title">Quick book — card next to the slot</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="6"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">4 taps: slot → client → service → Book.</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1800,"height":900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[556, 374, "Card opens next to the tapped slot (not a full drawer), soft fade (0.22 s). Time + length with − / + (15 min steps)."], [556, 419, "Client: type name or phone → top 3 matches; recent clients as chips."], [556, 516, "History hint: what this client usually gets, with whom, notes (sensitive skin)."], [556, 592, "Service: only her top 4 + “All 15 ›” (long menus open a list, D2b). Picking one sets the length. Suggested one is dashed."], [556, 660, "Who: only staff free at that time; “Next turn · Tuyết” first; “More ›” opens everyone (D2c). Facts only."], [736, 753, "Book + text: grey until client + service are set. Then the block appears with a glow + Undo toast (D10)."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
