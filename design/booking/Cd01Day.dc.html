<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: overview</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="afw">
  <div class="afw-screen">
    <dc-import name="Cal" scenario="day" hint-size="1440px,900px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="10"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · D1</div>
    <div class="af-title">Merged calendar — the day at a glance</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="10"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Built from Oliver&#x27;s calendar + Apple / Notion / Google patterns.</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1800,"height":900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[300, 250, "Waitlist (from the check-in kiosk): ticket #, service, wait time (orange after 15 min). Drag a card onto a staff column to book it (D6)."], [640, 150, "Counts bar = filters: booked, online, walk-in, ? not confirmed, ✓ confirmed, ● in chair, $ ready for bill, ✕ cancelled, ★ asked for staff. Tap → everything else dims (D8)."], [470, 196, "Staff header: turns + appointments today, NEXT tag on whose turn it is."], [930, 196, "Late staff: column tinted + striped, “Cover →” (D7)."], [1220, 150, "Up next: turn order with free / busy / free-at time / turns. Book → quick-book card at that staff's free time."], [720, 73, "Overlap banner: says what clashed and that nobody was moved. Show → highlights it (D9)."], [560, 560, "Drag on empty space to create (D3); click for 45 min (D2). Drag a booking to move (D5); bottom edge to resize. Hover → peek (D4)."], [1140, 28, "Search (/) and + Book (N). Shortcuts: T today, ← → day."], [180, 800, "Mini month with busy dots; tap a day to jump."], [400, 500, "In the chair: timer starts when the client sits (front desk taps Start, or the tech on their phone). Shows minutes so far vs usual time for that service + a thin green bar. Facts only, no alarm. Each visit saves real time per service per tech → Today and payout insights (who is fast/slow per service, rebook length)."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
