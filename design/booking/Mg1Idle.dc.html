<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar gestures: Day on the phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="afp">
  <div class="afp-screen">
    <dc-import name="CalPhone" g="idle" hint-size="390px,844px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="5"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · G1 · Front desk / owner phone</div>
    <div class="af-title">Day on the phone</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="5"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Tap → G2 · Hold → G3</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":750,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[46, 78, "Pick a staff (or All, which shows 2 columns side by side, scrolls sideways)."], [70, 480, "Tap a booking = view it (G2). Hold 0.4 s = pick it up to move or resize (G3)."], [46, 383, "Red line = now. Pull down to jump back to today; swipe left/right = next/previous day."], [300, 790, "+ = new booking at the next free time. Or hold on an empty spot (G7)."], [70, 190, "Pinch to make hours taller/shorter (40–96 px per hour)."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
