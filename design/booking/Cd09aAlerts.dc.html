<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: alerts open</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="afw">
  <div class="afw-screen">
    <dc-import name="Cal" scenario="alerts" hint-size="1440px,900px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="4"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · D9a</div>
    <div class="af-title">Alerts open</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="4"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Next: Show → D9 (overlap highlighted) · Cover → D7 (cover panel).</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1800,"height":900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[1250, 28, "Alerts button: bell icon + orange count. Tap opens the list; tap again or outside closes it. Turns ink while open."], [1078, 120, "Overlap row: warning icon, what clashed, who. Show → closes the list, dims everything except the two clashing bookings, toast tells how to fix (D9)."], [1078, 186, "Late staff row: clock icon. Cover → opens the cover panel to move both bookings to free staff and text the clients (D7). After cover the row greys out and the count drops to 1."], [1078, 250, "Facts only: nothing moves on its own. Same alerts show on Today → Needs attention."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
