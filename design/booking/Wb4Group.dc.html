<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Booking page: group</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nailsalonosdesignsystem_afaa02/styles.css">
<link rel="stylesheet" href="pos.css">
<link rel="stylesheet" href="annot.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="af">
  <div class="af-screen">
    <dc-import name="BookWeb" at="group" hint-size="1280px,800px"></dc-import>
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><sc-for list="{{pins}}" as="p" hint-placeholder-count="3"><span class="pin" style="{{p.pos}}">{{p.n}}</span></sc-for></sc-if>
  </div>
  <aside class="af-notes"><button class="af-toggle" type="button" onClick="{{toggleNotes}}">{{toggleLabel}}</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="af-body">
    <div class="eyebrow">Annotations · W4</div>
    <div class="af-title">Book a group</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="3"><div class="af-row"><span class="pin static">{{p.n}}</span><div class="af-txt">{{p.t}}</div></div></sc-for>
    <div class="af-next">Times shown are ones where enough staff are free at once (W6).</div>
  </div></sc-if></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":"boolean","default":true},"$preview":{"width":1640,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { show: !(p && p.notes === false) }; }
  renderVals() {
    const P = [[78, 212, "Guests: You · Guest 2 · + Add guest (up to 6). Each guest picks their own services."], [922, 200, "Cart groups items by guest; total for the whole group."], [78, 330, "Same service list per guest."]];
    return { show: this.state.show, toggleLabel: this.state.show ? "Hide notes" : "Show notes", toggleNotes: () => this.setState({ show: !this.state.show }), yes: true, pins: P.map((p, i) => ({ n: i + 1, pos: 'left:' + p[0] + 'px;top:' + p[1] + 'px', t: p[2] })) };
  }
}
</script>
</body>
</html>
